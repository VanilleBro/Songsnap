name: APK bauen

on:
  push:
    paths-ignore:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: APK kompilieren
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SongSnap.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SongSnap-APK
          path: SongSnap.apk

      - name: APK als Release veröffentlichen (Download direkt aufs Handy)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SongSnap (neueste Version)
          body: Lade **SongSnap.apk** herunter und installiere sie auf deinem Android-Handy.
          files: SongSnap.apk
          make_latest: true
