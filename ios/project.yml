name: SongSnap
options:
  bundleIdPrefix: com.songsnap
  deploymentTarget:
    iOS: "16.0"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 3.0.0
targets:
  SongSnap:
    type: application
    platform: iOS
    sources:
      - SongSnap
    dependencies:
      - package: SpotifyiOS
    scheme: {}
    info:
      path: SongSnap/Info.plist
      properties:
        CFBundleDisplayName: SongSnap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLName: com.songsnap.game
            CFBundleURLSchemes:
              - songsnap
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songsnap.game
        PRODUCT_NAME: SongSnap
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
